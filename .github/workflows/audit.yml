# Static checks on every push and PR (no rendering): the shared core, then every topic in projects/.
# MASTER_PROMPT_FINAL §12, §20.
name: audit
on:
  push:
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: audit the shared core
        run: node scripts/audit.mjs
      - name: audit every topic in projects/
        run: |
          # audit.mjs scopes a topic run to that topic plus the shared core (not other topics)
          for d in projects/*/; do
            [ -d "$d" ] || continue
            slug=$(basename "$d")
            echo "== $slug"
            node scripts/audit.mjs --scenes "src/projects/$slug/scenes" --content "projects/$slug/content" --timeline "src/projects/$slug/data/timeline.json"
          done
      - name: line-end checker (the rule itself; scene findings are warnings inside audit)
        run: node scripts/lines-check.mjs --selftest
      - name: handedness of the kit (right-hand rules must use physCross)
        run: node scripts/handed-check.mjs
      - name: the topic scaffold still compiles and audits clean
        run: node scripts/selftest-new-topic.mjs
