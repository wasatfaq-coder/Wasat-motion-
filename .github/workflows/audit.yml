# Static checks on every push and PR (no rendering): types, lint, captions, palette, projection,
# visual register (locations, metaphors, data accuracy), timeline and sound map. MASTER_PROMPT_FINAL §12, §20.
name: audit
on:
  push:
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: caption, timeline and preview regressions
        run: node scripts/regress-checks.mjs
      - run: node scripts/audit.mjs
      - name: audit every topic in projects/
        run: |
          # audit.mjs scopes a topic run to that topic plus the shared core (not the root topic)
          for d in projects/*/; do
            [ -d "$d" ] || continue
            slug=$(basename "$d")
            echo "== $slug"
            node scripts/audit.mjs --scenes "src/projects/$slug/scenes" --content "projects/$slug/content" --timeline "src/projects/$slug/data/timeline.json"
          done
      - name: line-end checker (the rule itself; scene findings are warnings inside audit)
        run: node scripts/lines-check.mjs --selftest
      - name: motion check catches every defect kind on broken inputs (crop, depth, through, air, layout, jerk, pop, seam)
        run: node scripts/motion-check.mjs --selftest
      - name: object lint catches every root cause on broken objects (through, encircled, mount, terminal, fold, self-overlap, owner)
        run: node scripts/object-audit.mjs --selftest
      - name: house style has not drifted (showcase stills against styles/anatomy/refs, no colour but coral)
        run: node scripts/style-check.mjs
      - name: handedness of the kit (right-hand rules must use physCross)
        run: node scripts/handed-check.mjs
      - name: the topic scaffold still compiles and audits clean
        run: node scripts/selftest-new-topic.mjs
      - name: docs/rules is in sync with MASTER_PROMPT_FINAL.md (and the splitter catches stale/missing sections)
        run: node scripts/rules-split.mjs --selftest && node scripts/rules-split.mjs --check
