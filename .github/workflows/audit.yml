# Static checks on every push and PR (no rendering): types, lint, captions, palette, projection,
# visual register (locations, metaphors, data accuracy), timeline and sound map. MASTER_PROMPT_FINAL §12, §20.
name: audit
on:
  push:
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/audit.mjs
